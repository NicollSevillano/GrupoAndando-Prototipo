<section class="countdown">
  <div class="countdown-container">
    <span class="countdown-tag">Próximo encuentro</span>
    <h2>Te esperamos en nuestro próximo Meet</h2>
    <p>Vení a conocernos y sumate como voluntario</p>

    <div class="countdown-boxes">
      <div class="countdown-box">
        <strong>{{ dias() }}</strong>
        <span>días</span>
      </div>
      <div class="countdown-box">
        <strong>{{ horas() }}</strong>
        <span>horas</span>
      </div>
      <div class="countdown-box">
        <strong>{{ minutos() }}</strong>
        <span>min</span>
      </div>
      <div class="countdown-box">
        <strong>{{ segundos() }}</strong>
        <span>seg</span>
      </div>
    </div>
  </div>
</section>
