<section class="galeria" id="galeria">
  <div class="galeria-container">
    <span class="galeria-tag">Momentos</span>
    <h2>Nuestro trabajo en imágenes</h2>
    <p>Así vivimos cada sábado en la Villa 21-24</p>

    <div class="solo-desktop">
      <div class="galeria-grid">
        @for (foto of fotos; track foto) {
          <div class="galeria-item" (click)="abrir(foto)">
            <img [src]="foto" alt="Foto Grupo Andando" loading="lazy">
          </div>
        }
      </div>
    </div>

    <div class="solo-mobile">
      <div class="galeria-grid">
        @for (foto of fotosMobile; track foto) {
          <div class="galeria-item" (click)="abrir(foto)">
            <img [src]="foto" alt="Foto Grupo Andando" loading="lazy">
          </div>
        }
      </div>
    </div>
  </div>

  @if (fotoSeleccionada()) {
    <div class="lightbox" (click)="cerrar()">
      <img [src]="fotoSeleccionada()" alt="Foto ampliada">
      <button class="lightbox-close" (click)="cerrar()">✕</button>
    </div>
  }
</section>
